<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaunchManager</title>
</head>
<body>
  <h1>LaunchManager</h1>
  <p><a href="/projects/new">プロジェクトを追加 + </a></p>
  {% for p in projects %}
    <section class="project" data-project-id="{{ p.id }}">
      <h2>{{ p.name }} <small>({{ p.id }})</small></h2>

      <div>
        状態: <span id="status-{{ p.id }}">---</span>
        / PID: <span id="pid-{{ p.id }}">---</span>
      </div>

      <div style="margin-top: 6px;">
        auto_start:
        {% if p.auto_start %}
          <strong style="color: green;">ON</strong>
        {% else %}
          <strong style="color: gray;">OFF</strong>
        {% endif %}

        <form class="lm-form" action="/toggle_autostart/{{ p.id }}" method="post" style="display:inline; margin-left: 8px;">
          <button type="submit">Toggle</button>
        </form>
      </div>

      <div style="margin-top: 8px;">
        <button type="button" class="btn-logs" data-kind="stdout">stdout</button>
        <button type="button" class="btn-logs" data-kind="stderr">stderr</button>
        <button type="button" class="btn-logs" data-kind="manager">manager</button>
      </div>

      <div id="error-{{ p.id }}" style="color: red; margin-top: 6px;"></div>

      <div style="margin-top: 8px;">
        <form class="lm-form" action="/start/{{ p.id }}" method="post" style="display:inline;">
          <button id="btn-start-{{ p.id }}" type="submit">Start</button>
        </form>

        <form class="lm-form" action="/stop/{{ p.id }}" method="post" style="display:inline;">
          <button id="btn-stop-{{ p.id }}" type="submit">Stop</button>
        </form>

        <form class="lm-form" action="/restart/{{ p.id }}" method="post" style="display:inline;">
          <button id="btn-restart-{{ p.id }}" type="submit">Restart</button>
        </form>
      </div>

      <hr />
    </section>
  {% endfor %}

  <!-- ========================= -->
  <!-- Log Modal -->
  <!-- ========================= -->
  <div id="logModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);">
    <div style="position:absolute; top:5%; left:5%; right:5%; bottom:5%; background:#0f0f10; color:#e6e6e6; border-radius:10px; overflow:hidden; display:flex; flex-direction:column;">

      <!-- Header -->
      <div style="padding:10px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #333;">
        <div>
          <strong id="logModalTitle">Logs</strong>
          <span id="logModalMeta" style="margin-left:10px; color:#aaa; font-size:12px;"></span>
        </div>
        <div>
          <button type="button" id="logPopoutBtn">Popout</button>
          <button type="button" id="logCloseBtn">✕</button>
        </div>
      </div>

      <!-- Controls -->
      <div style="padding:8px 12px; border-bottom:1px solid #333; font-size:13px;">

        <!-- 行数 + 折り返し + 更新 -->
        <div style="margin-bottom:6px;">
          <label style="margin-right:12px;">
            行数:
            <select id="logLineCount">
              <option value="200">200</option>
              <option value="500" selected>500</option>
              <option value="1000">1000</option>
            </select>
          </label>

          <label style="margin-right:12px;">
            <input type="checkbox" id="logWrap" checked />
            折り返し
          </label>

          <button type="button" id="logRefreshBtn">更新</button>
        </div>

        <!-- フィルタ -->
        <div>
          フィルタ:
          <label style="margin-right:10px;">
            <input type="checkbox" id="filter-debug" checked>
            DEBUG
          </label>
          <label style="margin-right:10px;">
            <input type="checkbox" id="filter-access" checked>
            ACCESS
          </label>
          <label style="margin-right:10px;">
            <input type="checkbox" id="filter-warning" checked>
            WARNING
          </label>
          <label>
            <input type="checkbox" id="filter-error" checked>
            ERROR
          </label>
        </div>

      </div>

      <!-- Log Body -->
      <pre id="logModalBody"
           style="margin:0; padding:12px; flex:1; overflow:auto; white-space:pre-wrap;
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
                  font-size:12px; line-height:1.5;"></pre>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/status.js') }}"></script>
</body>
</html>
