<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaunchManager</title>
</head>
<body>
    <h1>todoapp</h1>

    <!-- 状態表示：JSが中身を書き換える -->
    <h2>
        <div id="status">Loading...</div>
    </h2>

    <!-- Start -->
    <form action="/start_backend" method="post">
        <button type="submit">
            Backend start
        </button>
    </form>

    <!-- Stop -->
    <form action="/stop_backend" method="post">
        <button>
            Backend stop
        </button>
    </form>

    <!-- Restart -->
    <form action="/restart_backend" method="post">
        <button>
            Backend restart
        </button>
    </form>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/status.js') }}"></script>
</body>
</html>
